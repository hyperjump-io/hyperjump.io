# Docs follow the Google developer documentation style guide, checked by
# Vale. Run `vale sync` once to download the styles. See design/style/.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google, proselint, https://hyperjump.io/vale/Hyperjump.zip

# This repo's own pages, not the docs copied from the other repos.
[{README.md,src/content/docs/*.{md,mdx},src/content/docs/{components,blog}/**/*.{md,mdx}}]
BasedOnStyles = Vale, Google, proselint

[design/**/*.md]
BasedOnStyles = Vale, proselint
